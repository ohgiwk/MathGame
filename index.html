<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- one per device setting, so the browser picks the right one even before the script runs -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1a35" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e6" />
    <!-- Pick the theme before the first paint, so the page never flashes in the other one.
         Mirrors resolveTheme / THEME_COLORS in src/logic/theme.ts and the key in preferencesStore. -->
    <script>
      ;(function () {
        var choice = 'auto'
        try {
          var stored = JSON.parse(localStorage.getItem('math-kingdom:preferences') || '{}')
          if (stored.theme === 'light' || stored.theme === 'dark') choice = stored.theme
        } catch (e) {}
        var theme =
          choice === 'auto'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : choice
        document.documentElement.dataset.theme = theme
        // a theme chosen in Settings wins over the device setting, so both tags get its color
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0e1a35' : '#f5f0e6')
        })
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cinzel is limited to letters so digits and symbols use the plainer Shippori Mincho B1 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>数の王国</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
