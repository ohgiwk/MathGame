<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080D1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>数の王国</title>
    <style>
      :root {
        --bg-deep:    #080D1A;
        --bg-mid:     #0D1628;
        --bg-card:    #111E38;
        --bg-card2:   #162040;
        --border:     #2A3F6A;
        --border-gem: #3B5080;
        --gold:       #C9A836;
        --gold-light: #E0C060;
        --text-main:  #D6E0F5;
        --text-sub:   #7A95BF;
        --gem-blue:   #4C7CFF;
        --gem-indigo: #7B5CF6;
        --gem-teal:   #0BBFA0;
        --gem-ruby:   #E03060;
        --gem-emerald:#10C87A;
        --shadow-gem: 0 0 18px rgba(76,124,255,0.25);
        --shadow-card:0 4px 24px rgba(0,0,0,0.5);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      /* pan only: disables pinch and double-tap zoom */
      html { background: #080D1A; touch-action: pan-x pan-y; }
      body {
        background: radial-gradient(ellipse at 30% 20%, #0E1A35 0%, #080D1A 60%, #050A14 100%);
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        color: var(--text-main);
      }
      /* --app-height follows the visual viewport (see main.ts) so the layout fits above the keyboard */
      #app {
        height: 100vh;
        height: var(--app-height, 100dvh);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Gem shimmer texture */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(circle at 15% 15%, rgba(76,124,255,0.06) 0%, transparent 50%),
          radial-gradient(circle at 85% 80%, rgba(123,92,246,0.06) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(11,191,160,0.03) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
      }
      #app { position: relative; z-index: 1; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }
      .shake { animation: shake 0.4s ease; }

      @keyframes pop-in {
        0% { transform: scale(0.7); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .pop-in { animation: pop-in 0.25s ease forwards; }

      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .fade-in-up { animation: fade-in-up 0.35s ease forwards; }

      @keyframes gem-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(76,124,255,0.3); }
        50%       { box-shadow: 0 0 24px rgba(76,124,255,0.55); }
      }

      .screen-enter-active, .screen-leave-active { transition: opacity 0.22s ease; }
      .screen-enter-from, .screen-leave-to { opacity: 0; }

      .feedback-enter-active { transition: opacity 0.15s ease, transform 0.15s ease; }
      .feedback-leave-active { transition: opacity 0.15s ease; }
      .feedback-enter-from { opacity: 0; transform: scale(0.95); }
      .feedback-leave-to { opacity: 0; }

      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--bg-deep); }
      ::-webkit-scrollbar-thumb { background: var(--border-gem); border-radius: 4px; }

      /* Card base */
      .rpg-card {
        background: linear-gradient(145deg, var(--bg-card) 0%, var(--bg-card2) 100%);
        border: 1px solid var(--border-gem);
        border-radius: 16px;
        box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* Option buttons */
      .opt-btn {
        background: var(--bg-card);
        border: 2px solid var(--border);
        border-radius: 12px;
        color: var(--text-sub);
        padding: 10px 8px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .opt-btn:active { transform: scale(0.95); }
      .opt-btn.active {
        border-color: var(--gold);
        background: linear-gradient(135deg, #1C2B50, #162040);
        color: var(--gold-light);
        box-shadow: 0 0 12px rgba(201,168,54,0.25), inset 0 1px 0 rgba(201,168,54,0.1);
      }

      /* Primary button */
      .btn-gem {
        display: block;
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #3B5CF0 0%, #5B3CF0 100%);
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.05em;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(76,124,255,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
        transition: all 0.15s ease;
      }
      .btn-gem:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(76,124,255,0.3); }
      .btn-gem:disabled { opacity: 0.4; cursor: default; }

      /* Secondary button */
      .btn-ghost {
        display: block;
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border-gem);
        border-radius: 14px;
        background: transparent;
        color: var(--text-sub);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-ghost:active { transform: scale(0.97); background: rgba(255,255,255,0.04); }

      /* Answer input */
      .answer-input {
        width: 100%;
        text-align: center;
        font-size: 40px;
        font-weight: 800;
        border-radius: 16px;
        border: 2px solid var(--border-gem);
        background: var(--bg-deep);
        color: var(--text-main);
        padding: 16px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }
      .answer-input:focus {
        border-color: var(--gem-blue);
        box-shadow: 0 0 0 3px rgba(76,124,255,0.2);
      }
      .answer-input::placeholder { color: #3A4E70; }

      /* Stat tile */
      .stat-tile {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 10px;
        text-align: center;
      }
      .stat-label { font-size: 11px; color: var(--text-sub); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
      .stat-value { font-size: 28px; font-weight: 800; color: var(--gold-light); }
      .stat-value.accent { color: var(--gem-teal); }
      .stat-value.danger  { color: var(--gem-ruby); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
