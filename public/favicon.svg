<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="90%">
      <stop offset="0" stop-color="#1b2d5c" />
      <stop offset="0.55" stop-color="#0e1a35" />
      <stop offset="1" stop-color="#070c18" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9a6" />
      <stop offset="0.45" stop-color="#e0c060" />
      <stop offset="1" stop-color="#a07820" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- glow behind the hexagon -->
  <polygon
    points="256,106 385.9,181 385.9,331 256,406 126.1,331 126.1,181"
    fill="none" stroke="#e0c060" stroke-width="34" stroke-linejoin="round"
    opacity="0.7" filter="url(#glow)"
  />
  <polygon
    points="256,106 385.9,181 385.9,331 256,406 126.1,331 126.1,181"
    fill="none" stroke="#f3dc8a" stroke-width="26" stroke-linejoin="round"
    opacity="0.8" filter="url(#soft)"
  />
  <!-- hexagon -->
  <polygon
    points="256,106 385.9,181 385.9,331 256,406 126.1,331 126.1,181"
    fill="none" stroke="url(#gold)" stroke-width="24" stroke-linejoin="round"
  />
</svg>
